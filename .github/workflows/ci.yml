name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Syntax check every source file
        run: |
          for f in electron/*.js electron/*.cjs electron/*.mjs renderer/app.js scripts/*.mjs; do
            node --check "$f" || exit 1
          done
          python3 -m py_compile engine/*.py

      - name: Build (unsigned)
        run: npm run pack
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: Cutright-mac-arm64
          path: dist/mac-arm64/Cutright.app
          retention-days: 7
